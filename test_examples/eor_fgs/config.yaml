# Run from the repository root. All input rows are already selected.
model: eor+fg
data_path: test_examples/eor_fgs/visibilities.npy
inst_model: test_examples/instrument
array_save_directory: outputs/laptop_eor_fgs_nside128/matrices
output_dir: outputs/laptop_eor_fgs_nside128
# Use --prepare-kl to construct this basis; latent coefficients have unit variance.
foreground_kl_path: outputs/laptop_eor_fgs_nside128/kl/T_fg_reduced.npy
fov_fg: 10.0
beta_fg: [2.63, 2.82]

# All 30 signed baseline groups; central 15 integrations and channels.
n_freq: 15
f0_mhz: 158.3984375
df_mhz: 0.09765625
n_t: 15
d_t: 21.511369943618774
jd_center: 2459999.097166265
telescope_latlonalt: [-30.72152777777791, 21.428305555555557, 1073.0000000093132]
beam_type: airy
diam: 14.2

# Infer transverse Fourier sampling; share one image grid for both components.
fov_eor: 10.0
nside: 128
# Preserve the simulation's time-union boundary while refining both model grids.
footprint_nside: 64
sigma: 0.006464
noise_seed: 742123
random_key: 42

# Broad log10(Delta^2 / mK^2) priors; small demonstration sampling budget.
priors: [[-1, 6], [-1, 6], [-1, 6], [-1, 6], [-1, 6], [-1, 6]]
n_live_scale_factor: 10
