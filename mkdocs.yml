site_name: BayesEoR
site_description: Physically motivated Bayesian inference of the cosmological 21-cm power spectrum.
site_url: https://jacobtutt.github.io/BayesEoR-JAX/
repo_url: https://github.com/JacobTutt/BayesEoR-JAX
repo_name: JacobTutt/BayesEoR-JAX
edit_uri: edit/main/docs/
strict: true
exclude_docs: |
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/branding/diagram-light.svg
  favicon: assets/branding/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

extra:
  version:
    provider: mike
    default: dev
    alias: true

plugins:
  - search
  - mike:
      alias_type: copy
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            allow_inspection: false
            docstring_style: numpy
            members_order: source
            show_root_heading: true
            show_source: false
            show_bases: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - assets/branding/branding.css
  - assets/stylesheets/details.css

extra_javascript:
  - assets/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home:
      - Overview: index.md
      - Installation: installation.md
      - Getting started: basics.md
  - Data:
      - Interferometric data: visibilities.md
      - Instrumental configuration: instrument.md
      - Observation configuration: observation.md
      - Visibility data: data.md
  - Model:
      - Bayesian forward model: model.md
      - EoR model: eor.md
      - Foreground model: foregrounds.md
      - KL Reduced Basis: kl-reduced-basis.md
      - Construction and execution: forward-model.md
  - Inference:
      - Overview: joint-inference.md
      - Δ² parameterisation: power-spectrum.md
      - Analytical marginalisation: marginalisation.md
      - Maximum a posteriori: map.md
      - Running inference: inference.md
      - Posterior analysis: outputs-analysis.md
  - Examples:
      - Running the example scripts: examples.md
      - Configuration reference: configuration.md
  - API:
      - Overview: api/index.md
      - Setup: api/setup.md
      - Data: api/data.md
      - Geometry: api/geometry.md
      - Operators: api/operators.md
      - Construction and KL reduction: api/construction.md
      - Inference: api/inference.md
      - Analysis: api/analysis.md
