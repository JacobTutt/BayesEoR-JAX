[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayeseor-jax"
version = "0.1.0"
description = "JAX-accelerated BayesEoR pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "astropy",
  "h5py",
  "jax[cuda12]",
  "distrax",
  "jax-healpy",
  "pyuvdata",
  "jsonargparse",
  "matplotlib",
  "tqdm",
  "anesthetic",
  "pymultinest",
  "blackjax @ git+https://github.com/handley-lab/blackjax@95e93ed93e726b95143b2f4a9582888621625f52",
]

[project.optional-dependencies]
csd3 = [
  "jaxmg[csd3] @ https://github.com/JacobTutt/jaxmg/raw/main/wheels/csd3/jaxmg-0.0.7-cp311-cp311-linux_x86_64.whl",
]
isambard = [
  "jaxmg[isambard] @ https://github.com/JacobTutt/jaxmg/raw/main/wheels/isambard/jaxmg-0.0.7-cp311-cp311-linux_aarch64.whl",
]

[tool.setuptools.packages.find]
include = ["bayeseor_jax*"]
