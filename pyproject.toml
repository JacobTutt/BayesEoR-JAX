[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayeseor-jax"
version = "0.1.0"
description = "JAX-accelerated BayesEoR pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<2.4",
  "scipy",
  "astropy",
  "h5py",
  "jax>=0.6.0",
  "distrax",
  "jax-healpy",
  "pyuvdata",
  "jsonargparse",
  "matplotlib",
  "pymultinest",
]

[project.optional-dependencies]
hpc = [
  "jax[cuda12]>=0.6.0",
  "jaxmg[csd3] @ https://github.com/JacobTutt/jaxmg/raw/main/wheels/csd3/jaxmg-0.0.7-cp311-cp311-linux_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "jaxmg[isambard] @ https://github.com/JacobTutt/jaxmg/raw/main/wheels/isambard/jaxmg-0.0.7-cp311-cp311-linux_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
csd3 = [
  "jax[cuda12]>=0.6.0",
  "jaxmg[csd3] @ https://github.com/JacobTutt/jaxmg/raw/main/wheels/csd3/jaxmg-0.0.7-cp311-cp311-linux_x86_64.whl",
]
isambard = [
  "jax[cuda12]>=0.6.0",
  "jaxmg[isambard] @ https://github.com/JacobTutt/jaxmg/raw/main/wheels/isambard/jaxmg-0.0.7-cp311-cp311-linux_aarch64.whl",
]

[tool.setuptools.packages.find]
include = ["bayeseor_jax*"]

[tool.setuptools.package-data]
"bayeseor_jax.analyze" = ["*.mplstyle"]
