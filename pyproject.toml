[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayeseor-jax"
version = "0.1.0"
description = "JAX-accelerated BayesEoR pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<2.4",
  "scipy",
  "astropy",
  "h5py",
  "jax>=0.11.1",
  "distrax",
  "jax-healpy",
  "pyuvdata",
  "jsonargparse",
  "matplotlib",
  "pymultinest",
]

[project.optional-dependencies]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.23",
  "mkdocstrings[python]==0.30.1",
  "mike==2.1.3",
]
hpc = [
  "jaxmg[cuda12]>=1.4.1,<2",
]

[tool.setuptools.packages.find]
include = ["bayeseor_jax*"]

[tool.setuptools.package-data]
"bayeseor_jax.analyze" = ["*.mplstyle"]
